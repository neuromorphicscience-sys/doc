services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      TASK_DATA_DIR: /data/tasks
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/data/tasks:/data/tasks
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

