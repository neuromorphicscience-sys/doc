name: Temporary UCI Arrhythmia Download

on:
  push:
    paths:
      - '.github/workflows/tmp-uci-arrhythmia-download.yml'

permissions:
  contents: read

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Download official UCI archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://archive.ics.uci.edu/static/public/5/arrhythmia.zip' \
            -o uci_arrhythmia.zip
          unzip -o uci_arrhythmia.zip -d package
          cat > package/README_DOWNLOAD.txt <<'EOF'
          UCI Machine Learning Repository — Arrhythmia Dataset

          Official dataset page:
          https://archive.ics.uci.edu/dataset/5/arrhythmia

          Official archive downloaded from:
          https://archive.ics.uci.edu/static/public/5/arrhythmia.zip

          Dataset citation:
          Guvenir H, Acar B, Muderrisoglu H, Quinlan R. Arrhythmia [Dataset].
          UCI Machine Learning Repository; 1997.
          DOI: 10.24432/C5BS32

          License: CC BY 4.0, as stated on the UCI dataset page.
          EOF
          (cd package && sha256sum * > SHA256SUMS.txt)
          zip -r UCI_Arrhythmia_Original_Data.zip package

      - name: Upload packaged data
        uses: actions/upload-artifact@v4
        with:
          name: UCI_Arrhythmia_Original_Data
          path: UCI_Arrhythmia_Original_Data.zip
          retention-days: 1
